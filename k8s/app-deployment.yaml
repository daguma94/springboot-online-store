apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-store-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-store-app
  template:
    metadata:
      labels:
        app: online-store-app
    spec:
      containers:
        - name: app
          image: daguma/springboot-online-store-app:k8s-v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
          
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_URL

            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
